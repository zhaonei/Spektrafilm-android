# Personal fork build: push to main -> signed APK -> GitHub Release.
#
# Fork of thetechgeekko/Spektrafilm-android (GPLv3). This workflow replaces the
# upstream debug CI in this fork only; the upstream copy is kept next to it as
# build-upstream-debug.yml.disabled for reference. The app itself is unmodified
# except for the preview ceiling (see the commit), so all engine, parity and
# accuracy properties of the upstream project still hold.
#
# What it does:
#   1. targeted unit test for the preview sizing table that this fork changed;
#   2. :app:assembleRelease -> UNSIGNED, minified APK (R8 on, as upstream ships),
#      versionCode = 15 + run number so every build is a real upgrade;
#   3. zipalign -P 16 (16 KB page alignment for the bundled .so) then apksigner
#      with v1 (JAR) AND v2 forced on; v3 deliberately OFF, matching the recipe
#      that is already proven to install on the target phone;
#   4. verify with --min-sdk-version 18 (below 24 is what makes apksigner actually
#      check the v1 JAR signature) and print the signer fingerprint;
#   5. upload the APK as a workflow artifact and attach it to a Release.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SIGNING_KEYSTORE           base64 of the release keystore (.jks)
#   SIGNING_KEY_ALIAS          keystore alias
#   SIGNING_KEYSTORE_PASSWORD  store password
#   SIGNING_KEY_PASSWORD       key password (same as store for PKCS12)
#
# NOTE ON UPDATES: this fork has its own applicationId (com.zhaonei.spektrafilm),
# so it installs BESIDE the upstream app rather than over it. Installing a
# differently-signed APK over an existing app with the same id is impossible --
# and an OEM installer reports exactly that as "the package cannot be parsed".
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-signed-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + sign (v1/v2/v3) + publish
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Same pins as app/build.gradle.kts: ndkVersion 28.2.13676358,
      # buildToolsVersion 36.0.0, compileSdk 37, cmake 3.22.1.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;28.2.13676358 cmake;3.22.1 build-tools;36.0.0 platforms;android-37.0

      - uses: gradle/actions/setup-gradle@v4

      # The two things this fork actually changes. Fast, and they gate the APK so a
      # broken preview table or a broken TIFF writer can never be published.
      - name: Native TIFF writer tests (host g++)
        run: |
          set -euo pipefail
          cd lib/tiffwriter/src/main/cpp
          g++ -std=c++17 -O2 -I. tests/test_tiff_writer.cpp tiff_writer.cpp -o "$RUNNER_TEMP/test_tiff_writer"
          "$RUNNER_TEMP/test_tiff_writer"

      - name: Preview sizing + memory classification unit tests
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests "com.spectrafilm.app.AdaptivePreviewTest" \
            --tests "com.spectrafilm.app.MemoryReclaimRetryTest" \
            --stacktrace

      - name: Assemble unsigned release
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          # Repository secrets supply the key, so there is deliberately no
          # keystore.properties in the tree: Gradle must emit an unsigned APK.
          test ! -e keystore.properties
          # Monotonic versionCode (15 + run number) so each build installs as an
          # update over the previous one instead of colliding with it.
          ./gradlew :app:assembleRelease \
            -PforkVersionCode=$((15 + GITHUB_RUN_NUMBER)) \
            --stacktrace
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK" >/dev/null 2>&1; then
            echo "::error::The Gradle build unexpectedly produced a signed APK"
            exit 1
          fi
          echo "unsigned APK: $(du -h "$APK" | cut -f1)"
          # What the installer will actually see. Printed so this log answers
          # "what package / version did you build" without re-running anything.
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" \
            | grep -E "^package:|^sdkVersion|^targetSdkVersion|^application-label:"

      - name: Align, sign (v1 JAR + v2), verify
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          : "${SIGNING_KEYSTORE:?secret SIGNING_KEYSTORE is empty or missing}"
          : "${SIGNING_KEY_ALIAS:?secret SIGNING_KEY_ALIAS is empty or missing}"
          : "${SIGNING_KEYSTORE_PASSWORD:?secret SIGNING_KEYSTORE_PASSWORD is empty or missing}"
          : "${SIGNING_KEY_PASSWORD:?secret SIGNING_KEY_PASSWORD is empty or missing}"

          KS="$RUNNER_TEMP/fork-signing-${GITHUB_RUN_ID}.jks"
          ( umask 077; printf '%s' "$SIGNING_KEYSTORE" | base64 -d > "$KS" )
          test -s "$KS"

          VERSION_NAME="$("$BT/aapt" dump badging "$APK" \
            | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          test -n "$VERSION_NAME"
          NAME="Spektrafilm-fork-${VERSION_NAME}-${GITHUB_RUN_NUMBER}.apk"
          mkdir -p out

          # 16 KB page alignment first (build-tools 35+ supports -P 16); the
          # bundled libspektra.so is then mmap-able on 16 KB-page devices.
          "$BT/zipalign" -f -P 16 4 "$APK" out/aligned.apk

          "$BT/apksigner" sign \
            --ks "$KS" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_KEYSTORE_PASSWORD \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --min-sdk-version 24 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --out "out/$NAME" out/aligned.apk

          rm -f "$KS"

          "$BT/zipalign" -c -v -P 16 4 "out/$NAME"
          # --min-sdk-version 18, exactly like the recipe that already installs on
          # this phone: apksigner only checks (and therefore only reports) the v1
          # JAR signature when the target platform needs it, i.e. below 24.
          "$BT/apksigner" verify --verbose --print-certs \
            --min-sdk-version 18 "out/$NAME" | tee out/verify.txt

          grep -q "Verified using v1 scheme (JAR signing): true" out/verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" out/verify.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): false" out/verify.txt
          grep -q "^Number of signers: 1$" out/verify.txt
          unzip -l "out/$NAME" | grep -q "META-INF/.*\\.RSA"

          "$BT/aapt" dump badging "out/$NAME" | grep -E "^package:"

          {
            echo "versionName: $VERSION_NAME"
            echo "run: $GITHUB_RUN_NUMBER"
            echo "commit: $GITHUB_SHA"
            echo "signing: v1 (JAR) + v2, both verified at --min-sdk-version 18"
          } > out/BUILD_INFO.txt
          sha256sum "out/$NAME" > out/SHA256SUMS.txt
          cat out/SHA256SUMS.txt

          VERSION_CODE="$("$BT/aapt" dump badging "out/$NAME" | sed -n "s/^package:.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)"
          APK_SHA256="$(sha256sum "out/$NAME" | cut -d' ' -f1)"
          {
            echo "SIGNED_APK=out/$NAME"
            echo "VERSION_NAME=$VERSION_NAME"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "APK_SHA256=$APK_SHA256"
          } >> "$GITHUB_ENV"

      - name: Signing material cleanup
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP"/fork-signing-*.jks
          if git ls-files --others --exclude-standard -- '*.jks' '*.keystore' keystore.properties | grep -q .; then
            echo "::error::Signing material leaked into the workspace"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: spektrafilm-fork-${{ github.run_number }}
          path: |
            out/*.apk
            out/SHA256SUMS.txt
            out/BUILD_INFO.txt
            out/verify.txt
          retention-days: 30

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fork.${{ github.run_number }}
          name: Spektrafilm fork build ${{ github.run_number }} (v${{ env.VERSION_NAME }})
          body: |
            Personal fork build of [Spektrafilm](https://github.com/thetechgeekko/Spektrafilm-android) (GPLv3).

            * **app id `com.zhaonei.spektrafilm`** — installs alongside the upstream
              release, does not replace it. No uninstall needed, no signature clash.
            * versionCode `${{ env.VERSION_CODE }}`, versionName `${{ env.VERSION_NAME }}`
            * workflow run `${{ github.run_number }}`, commit `${{ github.sha }}`
            * signed v1 (JAR) + v2 with this fork's own key, both verified by `apksigner`
              (`--min-sdk-version 18`, the same check the recipe that already installs uses)
            * `zipalign -P 16` (16 KB page aligned)

            Check the download is intact before installing — the SHA-256 of the APK is
            in `SHA256SUMS.txt` next to it:

            ```
            ${{ env.APK_SHA256 }}
            ```

            If the phone still says the package cannot be parsed, first install the
            upstream release alongside it (`com.spectrafilm.app`), then remove this one;
            that separates "our build" from "the phone".
          files: |
            ${{ env.SIGNED_APK }}
            out/SHA256SUMS.txt
          fail_on_unmatched_files: true
